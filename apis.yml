aid: digits-financial
name: Digits
description: >-
  Digits Financial, Inc. is an AI-native accounting software company founded in
  2018 and headquartered in San Francisco, California, by Jeff Seibert and Wayne
  Chang. It builds what it calls the world's first Agentic (Autonomous) General
  Ledger — a suite of custom-trained models and agents that auto-book the
  majority of business transactions in real time to keep books continuously
  closed rather than reconciled monthly. The platform covers automated
  bookkeeping and categorization, vendor research and enrichment, reconciliation,
  financial reporting and dashboards, bill pay, invoicing, automated accrual
  schedules, and an agentic month-end close, and it is sold to small businesses,
  startups, and the accounting firms that serve them. Its developer surface is
  the Digits Connect API — a REST API over the general ledger authenticated with
  OAuth 2.0, documented at developer.digits.com and served from
  connect.digits.com — alongside a webhooks surface and a hosted MCP server that
  exposes read-only ledger access to AI tools such as Claude and ChatGPT. Digits
  has raised roughly $97M from investors including Benchmark, GV, SoftBank,
  Bessemer Venture Partners, G Squared, and 20VC, and its shares trade on
  secondary marketplaces such as Forge Global ahead of any public listing.
